<title>FUN60 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Oxanium:wght@500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0d0f12;
  --panel: #14171c;
  --raised: #1b1f26;
  --cap: #22272f;
  --cap-top: #2a303a;
  --line: #2a2f38;
  --text: #e7ebf0;
  --muted: #8a94a3;
  --faint: #5b6472;
  --accent: #5cc6ff;
  --accent-ink: #06131c;
  --fn: #b89bff;
  --live: #3fdd8f;
  --warn: #ffb547;
  --bad: #ff6b6b;
  --shadow: 0 1px 0 #0006, 0 6px 18px #0005;
  --display: "Oxanium", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef1f5; --panel: #ffffff; --raised: #f5f7fa; --cap: #e9edf2; --cap-top: #fbfcfd;
    --line: #d5dbe3; --text: #121720; --muted: #566171; --faint: #8c95a3;
    --accent: #0a7fc7; --accent-ink: #ffffff; --fn: #7446d8; --live: #0f9f5a;
    --warn: #b86e00; --bad: #d23b3b; --shadow: 0 1px 0 #0000000d, 0 4px 14px #0000001a;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f5; --panel: #ffffff; --raised: #f5f7fa; --cap: #e9edf2; --cap-top: #fbfcfd;
  --line: #d5dbe3; --text: #121720; --muted: #566171; --faint: #8c95a3;
  --accent: #0a7fc7; --accent-ink: #ffffff; --fn: #7446d8; --live: #0f9f5a;
  --warn: #b86e00; --bad: #d23b3b; --shadow: 0 1px 0 #0000000d, 0 4px 14px #0000001a;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0f12; --panel: #14171c; --raised: #1b1f26; --cap: #22272f; --cap-top: #2a303a;
  --line: #2a2f38; --text: #e7ebf0; --muted: #8a94a3; --faint: #5b6472;
  --accent: #5cc6ff; --accent-ink: #06131c; --fn: #b89bff; --live: #3fdd8f;
  --warn: #ffb547; --bad: #ff6b6b; --shadow: 0 1px 0 #0006, 0 6px 18px #0005;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100%; }
.nav { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--cap); border: 1px solid var(--line); display: grid; place-items: center; font: 700 12px var(--display); color: var(--accent); }
.brand-name { font: 700 16px var(--display); letter-spacing: .04em; }
.brand-sub { font-size: 11px; color: var(--muted); }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: none; color: var(--muted); text-align: left; font-weight: 500; }
.nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button:hover { background: var(--raised); color: var(--text); }
.nav button[aria-current="page"] { background: var(--raised); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.nav-foot { margin-top: auto; padding: 12px 10px 0; font-size: 12px; color: var(--faint); }

main { display: flex; flex-direction: column; min-width: 0; }
.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.topbar h1 { font-size: 20px; margin-right: auto; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-size: 12px; font-weight: 500; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.pill.on i { background: var(--live); box-shadow: 0 0 8px var(--live); }
.pill.demo i { background: var(--warn); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-weight: 500; }
.btn:hover { border-color: var(--faint); }
a.btn { color: inherit; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.dirty { font-size: 12px; color: var(--warn); }

.banner { margin: 16px 28px 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 8px; background: var(--panel); font-size: 13px; color: var(--muted); }
.banner b { color: var(--text); font-weight: 600; }

.stage { padding: 28px 28px 8px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.board-wrap { width: 100%; max-width: 980px; }
.board { position: relative; margin: 0 auto; padding: calc(var(--u) * .28); border-radius: calc(var(--u) * .3); background: linear-gradient(180deg, var(--raised), var(--panel)); border: 1px solid var(--line); box-shadow: var(--shadow); --u: 56px; width: calc(var(--u) * 15 + var(--u) * .56); height: calc(var(--u) * 5 + var(--u) * .56); }
.key { position: absolute; padding: calc(var(--u) * .045); border: 0; background: none; }
.cap { position: relative; display: block; width: 100%; height: 100%; border-radius: calc(var(--u) * .12); background: var(--cap); border: 1px solid var(--line); box-shadow: inset 0 calc(var(--u) * -.06) 0 #0003; overflow: hidden; transition: transform .06s, border-color .12s; }
.cap::before { content: ""; position: absolute; inset: calc(var(--u) * .07) calc(var(--u) * .09) calc(var(--u) * .15); border-radius: calc(var(--u) * .09); background: var(--cap-top); }
.cap::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--led, transparent); opacity: var(--glow, 0); mix-blend-mode: screen; pointer-events: none; }
.lg, .lg2 { position: absolute; z-index: 1; line-height: 1.1; white-space: nowrap; }
.lg { left: calc(var(--u) * .16); top: calc(var(--u) * .13); font: 500 calc(var(--u) * .22) var(--body); }
.lg2 { right: calc(var(--u) * .16); bottom: calc(var(--u) * .2); font: 500 calc(var(--u) * .17) var(--body); color: var(--fn); }
.bar { position: absolute; z-index: 1; left: calc(var(--u) * .16); right: calc(var(--u) * .16); bottom: calc(var(--u) * .2); height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar > b { display: block; height: 100%; width: calc(var(--d, 0) * 100%); background: var(--live); }
.key:hover .cap { border-color: var(--faint); }
.key.sel .cap { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), inset 0 calc(var(--u) * -.06) 0 #0003; }
.key.live .cap { transform: translateY(1px); border-color: var(--live); }
.key.live .cap::before { background: color-mix(in srgb, var(--live) 22%, var(--cap-top)); }
.key.fnlayer .lg { color: var(--fn); }
.key.inherit .lg { color: var(--faint); }
.key.nokey .lg { color: var(--faint); font-style: italic; }
.board-legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); }
.board-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.panel { padding: 8px 28px 40px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-size: 16px; }
.card p { margin: 0; color: var(--muted); max-width: 62ch; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font: 600 22px var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.alert b { color: var(--bad); }
.log { list-style: none; margin: 0; padding: 0; font: 12px/1.9 var(--mono); max-height: 180px; overflow: auto; }
.log li { display: flex; gap: 10px; border-bottom: 1px dashed var(--line); }
.log li .t { color: var(--faint); min-width: 64px; }
.log li.dbl { color: var(--bad); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--raised); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px #0003; }
.seg button.fn[aria-pressed="true"] { color: var(--fn); }
.picker { display: flex; flex-direction: column; gap: 10px; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cats button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--muted); }
.cats button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
.search { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; max-height: 260px; overflow: auto; padding-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 7px; padding: 7px 6px; font-size: 12px; text-align: center; }
.chip:hover { border-color: var(--accent); }
.chip small { display: block; font: 10px var(--mono); color: var(--faint); }

.effects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.effect { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.effect[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.swatch { height: 22px; border-radius: 6px; }
.sw-static { background: var(--sw, #fff); }
.sw-breathe { background: linear-gradient(90deg, #ffffff10, #fff, #ffffff10); }
.sw-rainbow { background: linear-gradient(90deg, #ff4d4d, #ffd24d, #5cff7a, #4dd8ff, #7a5cff, #ff4dd2); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
label.field > span { display: flex; justify-content: space-between; color: var(--muted); }
label.field > span b { color: var(--text); font: 500 13px var(--mono); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.toggle { display: inline-flex; align-items: center; gap: 10px; }
.meter { height: 8px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
.meter > b { display: block; height: 100%; background: var(--accent); width: 0; }
textarea { width: 100%; min-height: 120px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font: 12px var(--mono); resize: vertical; }
.confirm { border: 1px solid var(--bad); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.note { font-size: 12px; color: var(--faint); }
code { font: 12px var(--mono); background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

.board { touch-action: none; }
.board[data-page="travel"] .lg2 { bottom: calc(var(--u) * .32); }
.box { position: absolute; z-index: 3; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 4px; pointer-events: none; }
.key.tested .cap { border-color: var(--live); }
.key.tested .cap::before { background: color-mix(in srgb, var(--live) 14%, var(--cap-top)); }
.key.over .cap { border-color: var(--warn); }
.wide { grid-column: 1 / -1; }
.modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mode { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 500; }
.mode small { font-size: 11px; color: var(--faint); font-weight: 400; }
.mode[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mode:disabled { opacity: .45; cursor: default; }
.travel { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: stretch; }
.shaft { position: relative; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); min-height: 180px; }
.shaft .fill { position: absolute; left: 0; right: 0; top: 0; background: color-mix(in srgb, var(--live) 30%, transparent); border-bottom: 2px solid var(--live); }
.shaft .mark { position: absolute; left: -4px; right: -4px; border-top: 2px dashed var(--c); }
.shaft .mark span { position: absolute; left: 8px; top: 2px; font: 11px var(--mono); color: var(--c); white-space: nowrap; }
canvas.trace { width: 100%; height: 180px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); display: block; }
.progress { display: flex; align-items: baseline; gap: 10px; }
.progress b { font: 600 28px var(--display); font-variant-numeric: tabular-nums; }

.versions { display: flex; flex-direction: column; gap: 10px; }
.version { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--raised); display: flex; flex-direction: column; gap: 8px; }
.version.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.badge { display: inline-block; padding: 0 9px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); font: 500 11px/18px var(--body); text-transform: uppercase; letter-spacing: .06em; }

@media (max-width: 860px) {
  .modes { grid-template-columns: repeat(3, 1fr); }
  .app { grid-template-columns: 1fr; }
  .nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .brand { padding: 4px 10px 4px 0; }
  .nav button { width: auto; padding: 8px 10px; }
  .nav button span { display: none; }
  .nav-foot { display: none; }
  .topbar, .panel { padding-left: 16px; padding-right: 16px; }
  .stage { padding: 18px 16px 8px; }
  .banner { margin: 12px 16px 0; }
}
@media (prefers-reduced-motion: reduce) { .cap { transition: none; } }
</style>

  <nav class="nav" aria-label="Sections">

    <div class="nav-foot">MonsGeek FUN60 Ultra TMR<br>RY5088 / AT32F405</div>

  </main>
</div>

<script>
"use strict";

/* ---------- keyboard layout: FUN60 Ultra TMR, 60% ANSI ----------
 * site = column * 8 + mux channel, as scanned by the open firmware (docs/hw-map.md). */
const CH = 8, SITES = 14 * CH;
const S = (col, ch) => col * CH + ch;
const ROWS = [
  [["Escape",0,0,1],["Digit1",1,0],["Digit2",2,0],["Digit3",3,0],["Digit4",4,0],["Digit5",5,0],["Digit6",6,0],["Digit7",7,0],["Digit8",8,0],["Digit9",9,0],["Digit0",10,0],["Minus",11,0],["Equal",12,0],["Backspace",13,0,2]],
  [["Tab",0,1,1.5],["KeyQ",1,1],["KeyW",2,1],["KeyE",3,1],["KeyR",4,1],["KeyT",5,1],["KeyY",6,1],["KeyU",7,1],["KeyI",8,1],["KeyO",9,1],["KeyP",10,1],["BracketLeft",11,1],["BracketRight",12,1],["Backslash",13,1,1.5]],
  [["CapsLock",0,2,1.75],["KeyA",1,2],["KeyS",2,2],["KeyD",3,2],["KeyF",4,2],["KeyG",5,2],["KeyH",6,2],["KeyJ",7,2],["KeyK",8,2],["KeyL",9,2],["Semicolon",10,2],["Quote",11,2],["Enter",13,2,2.25]],
  [["ShiftLeft",0,3,2.25],["KeyZ",2,3],["KeyX",3,3],["KeyC",4,3],["KeyV",5,3],["KeyB",6,3],["KeyN",7,3],["KeyM",8,3],["Comma",9,3],["Period",10,3],["Slash",11,3],["ShiftRight",12,3,2.75]],
  [["ControlLeft",0,4,1.25],["MetaLeft",2,4,1.25],["AltLeft",3,4,1.25],["Space",6,6,6.25],["AltRight",9,4,1.25],["Fn",10,4,1.25],["ContextMenu",11,4,1.25],["ControlRight",12,4,1.25]],
];
const KEYS = [];
ROWS.forEach((row, y) => { let x = 0; for (const [code, col, ch, w = 1] of row) { KEYS.push({ code, site: S(col, ch), x, y, w }); x += w; } });
const KEY_BY_SITE = new Map(KEYS.map(k => [k.site, k]));

/* ---------- device: open firmware protocol v2 over WebHID ----------
 * 64-byte feature reports on the vendor interface (usage page 0xFFFF), no report ID. Request
 * bytes 0..7 sum to 0xFF; opcode in byte 0, arguments in 1..6, payload from byte 8. The reply
 * comes back through GET_FEATURE with the opcode echoed in byte 0. */
const OP = { INFO: 0x8F, RAW: 0xF0, STATE: 0xF1, GET_MAP: 0xF2, SET_MAP: 0xF3, GET_CFG: 0xF4, SET_CFG: 0xF5, SAVE: 0xF6, DEFAULTS: 0xF7, POWER: 0xF8, RADIO: 0xF9, SET_RADIO: 0xFA, ISP_PREPARE: 0xC5, BOOT: 0x7F };
const MAP_PAGE = 56;

class HidKeyboard {
  constructor(dev) { this.dev = dev; this.queue = Promise.resolve(); this.demo = false; }
  name() { return this.dev.productName || "FUN60 Ultra TMR"; }
  request(op, args = [], payload = null) {
    const run = async () => {
      const r = new Uint8Array(64);
      r[0] = op; r.set(args.slice(0, 6), 1);
      let s = 0; for (let i = 0; i < 7; i++) s += r[i];
      r[7] = (0xFF - s) & 0xFF;
      if (payload) r.set(payload.slice(0, 56), 8);
      await this.dev.sendFeatureReport(0, r);
      if (op === OP.BOOT) return r;
      const v = await this.dev.receiveFeatureReport(0);
      let u = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
      if (u.length > 64 || (u[0] === 0 && u[1] === op)) u = u.subarray(1);
      if (u[0] !== op) throw new Error(`The keyboard did not answer request 0x${op.toString(16)}. Is the open firmware on it?`);
      return u;
    };
    const p = this.queue.then(run, run);
    this.queue = p.catch(() => {});
    return p;
  }
  async info() { const u = await this.request(OP.INFO); return { devId: u[1] | u[2] << 8, proto: u[3], version: `${u[8]}.${String(u[7]).padStart(2, "0")}` }; }
  async state() {
    const u = await this.request(OP.STATE);
    const pressed = new Set();
    for (let s = 0; s < SITES; s++) if (u[8 + (s >> 3)] & (1 << (s & 7))) pressed.add(s);
    return { pressed, fn: !!u[2] };
  }
  async raw() {
    const out = new Uint16Array(SITES);
    for (let page = 0; page * 30 < SITES; page++) {
      const u = await this.request(OP.RAW, [page]);
      for (let i = 0; i < 30 && page * 30 + i < SITES; i++) out[page * 30 + i] = u[3 + 2 * i] | u[4 + 2 * i] << 8;
    }
    return out;
  }
  async keymap() {
    const layers = [new Uint8Array(SITES), new Uint8Array(SITES)];
    for (let l = 0; l < 2; l++)
      for (let p = 0; p * MAP_PAGE < SITES; p++) {
        const u = await this.request(OP.GET_MAP, [l, p]);
        layers[l].set(u.subarray(8, 8 + Math.min(MAP_PAGE, SITES - p * MAP_PAGE)), p * MAP_PAGE);
      }
    return layers;
  }
  async setKeymap(layers) {
    for (let l = 0; l < 2; l++)
      for (let p = 0; p * MAP_PAGE < SITES; p++) {
        const chunk = layers[l].subarray(p * MAP_PAGE, Math.min(SITES, (p + 1) * MAP_PAGE));
        await this.request(OP.SET_MAP, [l, p, chunk.length], chunk);
      }
  }
  /* protocol v5 (fw v0.12): thresholds are percent of travel; older firmware keeps its ADC
   * counts, which are sent back unchanged */
  async config() {
    const u = await this.request(OP.GET_CFG), d = u.subarray(8);
    this.legacy = st.info.proto < 5 ? Array.from(d.subarray(7, 11)) : null;
    return { on: d[0], effect: d[1], level: d[2], r: d[3], g: d[4], b: d[5], debounce: d[6],
             pressPct: this.legacy ? CONFIG_DEFAULT.pressPct : d[7], releasePct: this.legacy ? CONFIG_DEFAULT.releasePct : d[8] };
  }
  async setConfig(c) {
    await this.request(OP.SET_CFG, [], [c.on, c.effect, c.level, c.r, c.g, c.b, c.debounce,
      ...(this.legacy || [c.pressPct, c.releasePct])]);
  }
  async save() { const u = await this.request(OP.SAVE); if (u[1] !== 1) throw new Error("The keyboard could not write its settings to flash."); }
  async defaults() { await this.request(OP.DEFAULTS); }
  async radio() { const u = await this.request(OP.RADIO); return { mode: u[1], state: u[2], seen: !!u[5] }; }
  /* protocol v4: switch mode like the Fn keys; pair = also start pairing (wireless modes) */
  async setRadio(mode, pair) { await this.request(OP.SET_RADIO, [mode, pair ? 1 : 0]); }
  async power() { const u = await this.request(OP.POWER); return { percent: u[1], usb: !!(u[2] & 1), charging: !!(u[2] & 2), raw: u[3] | u[4] << 8 }; }
  async bootloader() { await this.request(OP.BOOT, [0x55, 0xAA, 0x55, 0xAA]); }
}

/* the same interface over an in-memory keyboard; typing on any real keyboard presses its keys */
class DemoKeyboard {
  constructor() {
    this.demo = true; this.map = [BASE_DEFAULT.slice(), FN_DEFAULT.slice()];
    this.cfg = { ...CONFIG_DEFAULT }; this.saved = null; this.down = new Set(); this.depth = new Float32Array(SITES);
    addEventListener("keydown", e => { const s = SITE_BY_CODE.get(e.code); if (s !== undefined) this.down.add(s); });
    addEventListener("keyup", e => { const s = SITE_BY_CODE.get(e.code); if (s !== undefined) this.down.delete(s); });
    addEventListener("blur", () => this.down.clear());
    this.save();
  }
  name() { return "FUN60 Ultra TMR (demo)"; }
  async info() { return { devId: 2307, proto: 5, version: "0.12" }; }
  async radio() { return { mode: this.mode ?? 6, state: this.mode === 6 || this.mode === undefined ? 0 : 3, seen: true }; }
  async setRadio(mode) { this.mode = mode; }
  async power() { return { percent: 87, usb: true, charging: false, raw: 1560 }; }
  async state() { return { pressed: new Set(this.down), fn: false }; }
  async raw() {
    const out = new Uint16Array(SITES);
    for (let s = 0; s < SITES; s++) {
      const rest = KEY_BY_SITE.has(s) ? 1500 + ((s * 37) % 500) : 80;
      this.depth[s] += ((this.down.has(s) ? 1 : 0) - this.depth[s]) * 0.6;
      out[s] = Math.round(rest - (rest - 80) * this.depth[s] + (Math.random() * 6 - 3));
    }
    return out;
  }
  async keymap() { return [this.map[0].slice(), this.map[1].slice()]; }
  async setKeymap(l) { this.map = [l[0].slice(), l[1].slice()]; }
  async config() { return { ...this.cfg }; }
  async setConfig(c) { this.cfg = { ...c }; }
  async save() { this.saved = { map: [this.map[0].slice(), this.map[1].slice()], cfg: { ...this.cfg } }; }
  async defaults() { this.map = [BASE_DEFAULT.slice(), FN_DEFAULT.slice()]; this.cfg = { ...CONFIG_DEFAULT }; }
  async bootloader() {}
}

/* travel in percent, the way the firmware works it out (fw/src/keys.c): rest = highest reading,
 * bottom = lowest but at least MIN_TRAVEL below rest. Learned here since this page connected, so
 * it can differ a little from the keyboard's own numbers (learned since it powered on). */
const MIN_TRAVEL = 400, REST_MIN = 1000, REST_MAX = 3300;
function travel(s) {
  const v = st.raw[s], rest = st.cal.rest[s];
  let bottom = st.cal.bottom[s];
  if (bottom + MIN_TRAVEL > rest) bottom = Math.max(0, rest - MIN_TRAVEL);
  return { v, rest, bottom, ok: rest >= REST_MIN && rest <= REST_MAX, pct: rest > bottom ? Math.max(0, Math.min(100, (rest - v) * 100 / (rest - bottom))) : 0 };
}
function learn(raw) {
  for (let s = 0; s < SITES; s++) { const v = raw[s]; if (v > st.cal.rest[s]) st.cal.rest[s] = v; if (v < st.cal.bottom[s]) st.cal.bottom[s] = v; }
}

const THEME_KEY = "fun60-theme";

  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* private window: just this visit */ }
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  return `${MODES[r.mode] || r.mode}, ${r.seen ? `radio state ${r.state}` : "radio not answering"}`;
};
const batteryText = () => {
  const p = st.power;
  if (!p) return st.info && st.info.proto < 2 ? "needs firmware v0.06" : "-";
  if (!p.percent) return "no battery connected";
  return `${p.percent}%, ${p.charging ? "charging" : p.usb ? "on USB power" : "on battery"}`;
};

async function attach(kb) {
  st.kb = kb; st.error = ""; st.pollFailed = false; st.power = null; st.powerAt = null; st.radio = null;
  st.cal = newCal(); st.raw = null; st.trace = []; st.tested.clear();
  try {
    st.info = await kb.info();
    if (!kb.demo && !st.info.proto) {             /* stock, or open firmware before v0.05 */
      const v = st.info.version;
      st.kb = demo(); st.info = await st.kb.info();
      throw new Error(`The keyboard runs firmware v${v}, which doesn't have the FUN60 Studio protocol. Flash open firmware v0.05 or newer with ry-flash, then connect again. Showing the demo until then.`);
    }
    st.map = await kb.keymap(); st.cfg = await kb.config();
  } catch (e) {
    st.error = e.message; st.map = [BASE_DEFAULT.slice(), FN_DEFAULT.slice()]; st.cfg = { ...CONFIG_DEFAULT };
  }
  st.savedMap = [st.map[0].slice(), st.map[1].slice()]; st.savedCfg = { ...st.cfg };
  render();
}

async function connect() {
  try {
    const [dev] = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x3151, productId: 0x5030, usagePage: 0xFFFF }] });
    if (!dev) return;
    if (!dev.opened) await dev.open();
    await attach(new HidKeyboard(dev));
  } catch (e) { st.error = e.message; render(); }
}

async function push(what) {           /* live preview: lighting and performance apply at once */
  try { if (what === "cfg") await st.kb.setConfig(st.cfg); else await st.kb.setKeymap(st.map); st.error = ""; }
  catch (e) { st.error = e.message; }
  renderTop();
}

function buildBoard() {
  const board = $("board");
  board.innerHTML = KEYS.map(k => `<button class="key" data-site="${k.site}" style="left:calc(var(--u)*${k.x + 0.28});top:calc(var(--u)*${k.y + 0.28});width:calc(var(--u)*${k.w});height:var(--u)" aria-label="key"><span class="cap"><span class="lg"></span><span class="lg2"></span><span class="bar" hidden><b></b></span></span></button>`).join("");
  /* Keys page: click selects one, Shift/Ctrl-click adds, dragging draws a box (Shift adds to the
   * selection). Travel page: click picks the key shown in the graph. */
  let drag = null;
  const box = document.createElement("div"); box.className = "box"; box.hidden = true; board.append(box);
  const local = e => { const r = board.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  board.addEventListener("pointerdown", e => {
    if (st.page !== "keys" || e.button !== 0) return;
    drag = { at: local(e), add: e.shiftKey || e.ctrlKey || e.metaKey, moved: false };
    board.setPointerCapture(e.pointerId);
  });
  board.addEventListener("pointermove", e => {
    if (!drag) return;
    const [x, y] = local(e), [x0, y0] = drag.at;
    if (!drag.moved && Math.hypot(x - x0, y - y0) < 6) return;
    drag.moved = true; box.hidden = false;
    Object.assign(box.style, { left: Math.min(x, x0) + "px", top: Math.min(y, y0) + "px", width: Math.abs(x - x0) + "px", height: Math.abs(y - y0) + "px" });
  });
  board.addEventListener("pointerup", e => {
    if (!drag) return;
    const d = drag, b = box.getBoundingClientRect();     /* measure before hiding it */
    drag = null; box.hidden = true;
    if (d.moved) {
      if (!d.add) st.sel.clear();
      board.querySelectorAll(".key").forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.left < b.right && r.right > b.left && r.top < b.bottom && r.bottom > b.top) st.sel.add(+el.dataset.site);
      });
    } else {
      const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".key"); if (!el) return;
      const s = +el.dataset.site;
      if (d.add) st.sel.has(s) ? st.sel.delete(s) : st.sel.add(s);
      else { const only = st.sel.size === 1 && st.sel.has(s); st.sel.clear(); if (!only) st.sel.add(s); }
    }
    render();
  });
  board.addEventListener("click", e => {
    const el = e.target.closest(".key"); if (!el) return;
    const s = +el.dataset.site;
    if (st.page === "travel") { st.focus = s; st.trace = []; render(); }
    else if (st.page === "keys" && e.detail === 0) { st.sel.has(s) ? st.sel.delete(s) : st.sel.add(s); render(); }   /* Enter / Space */
  });
  const fit = () => { const w = $("board-wrap").clientWidth; board.style.setProperty("--u", Math.max(20, Math.min(62, Math.floor(w / 15.6))) + "px"); };
  new ResizeObserver(fit).observe($("board-wrap")); fit();
}

function renderBoard() {
  const remap = st.page === "keys", perf = st.page === "travel", test = st.page === "test";
  $("board").dataset.page = st.page;
  document.querySelectorAll(".key").forEach(el => {
    const s = +el.dataset.site, base = st.map[0][s], fn = st.map[1][s];
    const lg = el.querySelector(".lg"), lg2 = el.querySelector(".lg2"), bar = el.querySelector(".bar");
    let main = kcShort(base), cls = "";
    if (remap && st.layer === 1) { main = fn ? kcShort(fn) : kcShort(base); cls = fn ? "fnlayer" : "inherit"; }
    if (base === 0 && !(remap && st.layer === 1 && fn)) { main = "None"; cls = "nokey"; }
    lg.textContent = main;
    lg2.textContent = !remap || st.layer === 0 ? (fn ? kcShort(fn) : "") : "";
    if (perf) lg2.textContent = "";                  /* the live loop writes the travel percent */
    lg2.style.color = perf ? "var(--muted)" : "";
    bar.hidden = !perf;
    el.className = "key " + cls + ((remap && st.sel.has(s)) || (perf && st.focus === s) ? " sel" : "") +
      (st.pressed.has(s) ? " live" : "") + (test && st.tested.has(s) ? " tested" : "");
    el.setAttribute("aria-label", `${kcShort(base)}${fn ? ", Fn: " + kcShort(fn) : ""}`);
    el.setAttribute("aria-pressed", remap ? String(st.sel.has(s)) : perf ? String(st.focus === s) : "false");
  });
  const legend = { keys: [["var(--accent)", "Selected"], ["var(--fn)", "Fn layer"], ["var(--faint)", "Same as base"]],
                   device: [["var(--live)", "Pressed now"], ["var(--fn)", "Fn layer"]],
                   travel: [["var(--live)", "Travel now"], ["var(--accent)", "Shown in the graph"], ["var(--warn)", "Past the press point"]],
                   test: [["var(--live)", "Pressed at least once"]], lighting: [], firmware: [], settings: [] }[st.page];
  $("board-legend").innerHTML = legend.map(([c, t]) => `<span style="--c:${c}">${t}</span>`).join("");
}

function renderPanel() {
  const p = $("panel");
  p.innerHTML = PAGES[st.page]();
  BIND[st.page] && BIND[st.page](p);
}

function render() { renderTop(); renderBoard(); renderPanel(); }

/* ---------- web flasher: the factory bootloader (3151:502A) protocol ----------
 * A port of flasher/src/proto.rs and device.rs (ry-flash): 64-byte feature reports, no header
 * checksum in the bootloader, START [BA C0 chunks size24], 64-byte chunks (last one 0xFF-padded),
 * COMPLETE [BA C2 chunks sum24], then an ACK [AB .. .. .. 55=ok / AA=bad]. A successful flash resets
 * the board at once, so a missing ACK is normal; coming back as 3151:5030 is the real success. */
/* flasher-pure begin */
const FL_CHIP_ID = "AT32F405 8KMKB", FL_SLICE = 0x5000, FL_APP_VT = 0x200, FL_MAX = 0x28000 - 0x5000;
const flU32 = (b, i) => (b[i] | b[i + 1] << 8 | b[i + 2] << 16 | b[i + 3] << 24) >>> 0;
const flHasChip = (b, at) => b.length >= at + FL_CHIP_ID.length && [...FL_CHIP_ID].every((c, i) => b[at + i] === c.charCodeAt(0));
/* the part the bootloader writes (from a full image or an already-sliced one), or null if it isn't
 * a keyboard image with a sane vector table that fits the app region */
function flSlice(img) {
  const s = img.length >= 0x5200 && flHasChip(img, FL_SLICE) ? img.subarray(FL_SLICE) : flHasChip(img, 0) ? img : null;
  if (!s || s.length > FL_MAX || s.length < FL_APP_VT + 8) return null;
  const sp = flU32(s, FL_APP_VT), rv = flU32(s, FL_APP_VT + 4), reset = (rv & ~1) >>> 0;
  return sp >= 0x20000000 && sp <= 0x20020000 && (rv & 1) === 1 && reset >= 0x08005200 && reset < 0x08028000 ? s : null;
}
/* 24-bit sum of every byte sent, the 0xFF padding of the last chunk included */
function flChecksum(d) {
  let s = (64 - d.length % 64) % 64 * 0xFF;
  for (const b of d) s += b;
  return s & 0xFFFFFF;
}
function flChunks(d) {
  const out = [];
  for (let i = 0; i < d.length; i += 64) { const c = new Uint8Array(64).fill(0xFF); c.set(d.subarray(i, i + 64)); out.push(c); }
  return out;
}
const flFrame = (op, chunks, v) => Uint8Array.of(0xBA, op, chunks & 255, chunks >> 8, v & 255, v >> 8 & 255, v >> 16 & 255, ...new Uint8Array(57));
const flStart = (chunks, size) => flFrame(0xC0, chunks, size);
const flComplete = (chunks, sum) => flFrame(0xC2, chunks, sum);
/* ACK may come with a leading report ID 0 */
function flAck(a) {
  const at = (o, v) => a.length > o + 4 && a[o] === 0xAB && a[o + 4] === v;
  return at(0, 0x55) || at(1, 0x55) ? true : at(0, 0xAA) || at(1, 0xAA) ? false : null;   /* as device.rs */
}
/* flasher-pure end */

const BOOT_PID = 0x502A, BOOT_PAGE = 0xFF01;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isBoot = d => d.vendorId === 0x3151 && d.productId === BOOT_PID && d.collections.some(c => c.usagePage === BOOT_PAGE);
const isApp = d => d.vendorId === 0x3151 && d.productId === 0x5030 && d.collections.some(c => c.usagePage === 0xFFFF);
async function waitFor(match, ms) {
  for (const end = performance.now() + ms; performance.now() < end; await sleep(400)) {
    const d = (await navigator.hid.getDevices()).find(match);
    if (d) return d;
  }
  return null;
}

const FLASH_IDLE = { phase: "idle", done: 0, total: 0, msg: "" };
function flashSet(o) { Object.assign(st.flash, o); if (st.page === "firmware") renderPanel(); }

/* the bootloader is a new USB device, so the browser asks once; this runs on that button's click */
async function pickBootloader() {
  try {
    const [d] = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x3151, productId: BOOT_PID, usagePage: BOOT_PAGE }] });
    if (d) st.flash.bootDev = d;
  } catch (e) { flashSet({ msg: e.message }); }
}

async function flashFirmware() {
  const f = st.flash, slice = f.image, name = f.name;
  st.flashing = true; f.bootDev = null; f.restored = false;
  try {
    /* 1. a running open firmware: keep its settings (flashing erases them), then into the bootloader */
    if (st.kb && !st.kb.demo) {
      if (st.info.devId !== 2307) throw new Error(`This is board ${st.info.devId}, not a FUN60 Ultra TMR (2307). Not flashing it.`);
      f.backup = { map: [st.map[0].slice(), st.map[1].slice()], cfg: { ...st.cfg } };
      flashSet({ phase: "boot", msg: "Restarting the keyboard into its bootloader..." });
      await st.kb.request(OP.ISP_PREPARE, [0x3A]);
      await sleep(100);
      await st.kb.bootloader();
      try { await st.kb.dev.close(); } catch (e) { /* it is already gone */ }
      await attach(demo());                       /* stop polling the old device; flash state survives */
    }
    /* 2. find the bootloader: already allowed, or picked by the user from the browser's list */
    flashSet({ phase: "pick", msg: "Waiting for the bootloader (3151:502A). If the browser hasn't been allowed to use it yet, click the button below and pick it." });
    let dev = null;
    for (const end = performance.now() + 120000; !dev && performance.now() < end; await sleep(400))
      dev = f.bootDev || (await navigator.hid.getDevices()).find(isBoot) || null;
    if (!dev) throw new Error("The bootloader never showed up. Unplug and replug the keyboard; if it sits in the bootloader (no typing, no lights), come back here and flash again.");
    if (!dev.opened) await dev.open();

    /* 3. write: same frames and pauses as ry-flash (device.rs flash_slice) */
    const chunks = flChunks(slice), sum = flChecksum(slice);
    if (chunks.length > 0xFFFF) throw new Error("Image too large.");
    flashSet({ phase: "write", done: 0, total: chunks.length, msg: `Writing ${name}. Don't unplug the keyboard or close this tab.` });
    await dev.sendFeatureReport(0, flStart(chunks.length, slice.length));
    await sleep(30);
    for (let i = 0; i < chunks.length; i++) {
      await dev.sendFeatureReport(0, chunks[i]);
      if (i % 16 === 15 || i === chunks.length - 1) flashSet({ done: i + 1 });
      await sleep(2);
    }
    await sleep(30);
    await dev.sendFeatureReport(0, flComplete(chunks.length, sum));
    await sleep(60);
    let ack = null;
    try { const v = await dev.receiveFeatureReport(0); ack = flAck(new Uint8Array(v.buffer, v.byteOffset, v.byteLength)); }
    catch (e) { /* the board reset into the new firmware before answering: normal */ }
    if (ack === false) throw new Error("The bootloader rejected the checksum. Nothing was started; the keyboard stays in the bootloader, so it's safe to flash again.");

    /* 4. success = the keyboard comes back as itself */
    flashSet({ phase: "return", msg: "Written. Waiting for the keyboard to restart..." });
    const app = await waitFor(isApp, 20000);
    if (!app) {
      const still = (await navigator.hid.getDevices()).some(isBoot);
      throw new Error(still ? "It's still in the bootloader, so the image didn't take. Safe to flash again."
        : "The keyboard took the image but hasn't come back here. If it types, click Connect keyboard on the Device page. If it's dead, hold Esc while plugging it in, or see README section 5 (case open).");
    }
    st.flashing = false;
    if (!app.opened) await app.open();
    await attach(new HidKeyboard(app));
    flashSet({ phase: "done", msg: `Done: the keyboard is back, running open firmware ${st.info ? st.info.version : "?"}.` });
  } catch (e) {
    st.flashing = false;
    flashSet({ phase: "error", msg: e.message });
  }
}

async function restoreBackup() {
  const b = st.flash.backup;
  try {
    st.map = [b.map[0].slice(), b.map[1].slice()];
    st.cfg = { ...st.cfg, ...b.cfg, pressPct: b.cfg.pressPct ?? st.cfg.pressPct, releasePct: b.cfg.releasePct ?? st.cfg.releasePct };
    await save();
    flashSet({ restored: true, msg: st.error ? st.error : "Your keymap and settings are back and saved on the keyboard." });
  } catch (e) { flashSet({ msg: e.message }); }
}

async function loadFirmware(v) {
  const f = st.flash;
  try {
    let bytes, name;
    if (v instanceof File) { bytes = new Uint8Array(await v.arrayBuffer()); name = v.name; }
    else {
      const r = await fetch(`fw/fun60-v${v.version}.bin`);
      if (!r.ok) throw new Error(`Couldn't download v${v.version} (${r.status}).`);
      bytes = new Uint8Array(await r.arrayBuffer()); name = `open firmware v${v.version}`;
    }
    const s = flSlice(bytes);
    if (!s) throw new Error(`${name} isn't a FUN60 keyboard image (no "${FL_CHIP_ID}" chip ID or a bad vector table). Not flashing it.`);
    Object.assign(f, { image: s, name, pick: v instanceof File ? "file" : v.version, agree: false, ...FLASH_IDLE });
  } catch (e) { Object.assign(f, { image: null, pick: null, phase: "error", msg: e.message }); }
  renderPanel();
}

async function loadVersions() {
  try { const r = await fetch("fw/firmware.json"); if (!r.ok) throw 0; st.flash.list = await r.json(); }
  catch (e) { st.flash.list = []; }
  if (st.page === "firmware") renderPanel();
}

  keys() {

        <div class="confirm" style="border-color:var(--warn)">
          <b>Experimental. The command line is the recommended way to flash.</b>
          <span class="muted"><code>ry-flash</code> is the tested flasher (README section 0: <code>sudo flasher/target/release/ry-flash --image fun60_dfu.bin --custom --arm</code>); the files here work with it too, use the version's Download link. Flashing from the browser is new and hasn't been tried on a keyboard yet; it sends the same bytes as ry-flash, step for step.</span>
          <span class="muted"> Firmware marked experimental may not type at all. If a flash fails, the keyboard usually stays in its bootloader and you can flash again from here or with ry-flash. If it won't come back, hold Esc while plugging it in; the last resort is opening the case (README section 5). Flashing erases the keyboard's settings; this page keeps a copy and offers to put them back.</span>
        </div>
        ${f.image ? `<dl class="kv"><dt>Size</dt><dd>${f.image.length} bytes</dd><dt>Checksum</dt><dd>0x${flChecksum(f.image).toString(16).padStart(6, "0")}</dd>
          <dt>Keyboard</dt><dd>${connected ? `${st.info.devId === 2307 ? "FUN60 Ultra TMR" : "board " + st.info.devId}, v${running}` : "not connected: flashes a board already in its bootloader"}</dd></dl>` : ""}
        <label class="toggle"><input type="checkbox" id="fl-agree" ${f.agree ? "checked" : ""} ${f.image && !busy ? "" : "disabled"}> I understand, flash it anyway</label>
        <div class="row"><button class="btn danger" id="fl-go" ${f.image && f.agree && !busy && "hid" in navigator ? "" : "disabled"}>Flash ${f.image ? esc(f.name) : ""}</button></div>
        ${f.msg ? `<p style="color:${f.phase === "error" ? "var(--bad)" : f.phase === "done" ? "var(--live)" : "var(--text)"}">${esc(f.msg)}</p>` : ""}
        ${flow}
        ${f.phase === "done" && f.backup && !f.restored ? `<div class="row"><button class="btn primary" id="fl-restore">Put my settings back</button><span class="note">keymap, lighting, actuation and hold-off from before the flash</span></div>` : ""}
      </div>
      <div class="card">
        <div class="eyebrow">Manual</div>
        <h2>Bootloader only</h2>
        <p>Restarts the keyboard into the factory bootloader without flashing, for ry-flash. It stops typing until something is flashed.</p>
        ${st.confirmBoot ? `<div class="confirm"><b>Restart into the bootloader?</b><span class="muted">The keyboard disconnects and waits for a flash.</span><div class="row"><button class="btn danger" id="boot-yes">Restart it</button><button class="btn" id="boot-no">Cancel</button></div></div>`
          : `<div class="row"><button class="btn" id="boot" ${connected && !busy ? "" : "disabled"}>Restart into bootloader</button></div>`}
      </div>
    </div>`;
  },

  settings() {
    const dirty = isDirty(), connected = st.kb && !st.kb.demo;
    return `<div class="cols">
      <div class="card">
        <div class="eyebrow">Settings</div>
        <h2>Saved on the keyboard</h2>
        <p>${dirty ? "You have changes that only live in this page until you save them." : "Everything on the keyboard matches what you see here."}</p>
        <div class="row"><button class="btn primary" id="save2" ${dirty ? "" : "disabled"}>Save to keyboard</button>
          <button class="btn" id="defaults">Restore defaults</button></div>
        <p class="note">Restore defaults loads the stock layout, our arrows and rainbow lighting. Save afterwards to keep it.</p>
      </div>
      <div class="card">
        <div class="eyebrow">Backup</div>
        <h2>Export and import</h2>
        <div class="row"><button class="btn" id="export">Export</button><button class="btn" id="download" ${st.exportText ? "" : "disabled"}>Download .json</button><button class="btn" id="copy" ${st.exportText ? "" : "disabled"}>Copy</button></div>
        <textarea id="backup" spellcheck="false" placeholder="Export fills this in. To import, paste a backup here or pick a file.">${esc(st.exportText)}</textarea>
        <div class="row"><input type="file" id="import-file" accept=".json,application/json"><button class="btn" id="import">Import</button></div>
      </div>
      <div class="card">
        <div class="eyebrow">This page</div>
        <h2>Appearance</h2>
        <div class="seg" role="group" aria-label="Theme">${["auto", "light", "dark"].map(t => `<button data-theme-pick="${t}" aria-pressed="${theme() === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>
      </div>
    </div>`;
  },
};

const BIND = {
  device(p) {
    p.querySelector("#connect")?.addEventListener("click", connect);
    p.querySelector("#use-demo")?.addEventListener("click", () => attach(demo()));
    const go = async (mode, pair) => {
      try { await st.kb.setRadio(mode, pair); st.radio = await st.kb.radio(); st.error = ""; } catch (e) { st.error = e.message; }
      render();
    };
    p.querySelectorAll(".mode").forEach(b => b.onclick = () => go(+b.dataset.mode, false));
    p.querySelector("#pair").onclick = () => go(st.radio.mode, true);
  },
  keys(p) {
    p.querySelector("#layer-0").onclick = () => { st.layer = 0; render(); };
    p.querySelector("#layer-1").onclick = () => { st.layer = 1; render(); };
    p.querySelector("#press-select").onchange = e => { st.pressSelect = e.target.checked; renderPanel(); };
    const edit = f => { f(); push("map"); render(); };
    const assign = code => edit(() => st.sel.forEach(s => { st.map[st.layer][s] = code; }));
    p.querySelectorAll(".chip").forEach(b => b.onclick = () => assign(+b.dataset.code));
    p.querySelectorAll(".cats button").forEach(b => b.onclick = () => { st.cat = b.dataset.cat; st.query = ""; renderPanel(); });
    const q = p.querySelector("#kc-search");
    q.oninput = () => { st.query = q.value; renderPanel(); const n = $("kc-search"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    p.querySelector("#sel-all").onclick = () => { KEYS.forEach(k => st.sel.add(k.site)); render(); };
    p.querySelector("#sel-none").onclick = () => { st.sel.clear(); render(); };
    p.querySelector("#swap").onclick = () => edit(() => {
      const [a, b] = [...st.sel], l = st.map[st.layer];
      [l[a], l[b]] = [l[b], l[a]];
    });
    p.querySelector("#to-default").onclick = () => edit(() => st.sel.forEach(s => { st.map[st.layer][s] = (st.layer ? FN_DEFAULT : BASE_DEFAULT)[s]; }));
    p.querySelector("#to-none").onclick = () => assign(0);
    p.querySelector("#wasd").onclick = () => edit(() => {
      [["KeyW", 0x52], ["KeyA", 0x50], ["KeyS", 0x51], ["KeyD", 0x4F]].forEach(([c, code]) => { st.map[1][SITE_BY_CODE.get(c)] = code; });
      st.layer = 1;
    });
  },
  travel(p) {
    const bindRange = (id, key, unit, check) => { const r = p.querySelector("#" + id); r.oninput = () => {
      st.cfg[key] = +r.value; check && check(); r.previousElementSibling.querySelector("b").textContent = `${st.cfg[key]} ${unit}`; push("cfg"); }; };
    const gap = () => { if (st.cfg.releasePct > st.cfg.pressPct - 5) st.cfg.releasePct = Math.max(5, st.cfg.pressPct - 5); renderPanel(); };
    bindRange("db", "debounce", "ms");
    if (p.querySelector("#th-press")) { bindRange("th-press", "pressPct", "%", gap); bindRange("th-release", "releasePct", "%", gap); }
    p.querySelector("#tv-relearn").onclick = () => { st.cal = newCal(); st.trace = []; };
  },
  lighting(p) {
    const set = (k, v) => { st.cfg[k] = v; push("cfg"); };
    p.querySelector("#led-on").onchange = e => set("on", e.target.checked ? 1 : 0);
    p.querySelectorAll(".effect").forEach(b => b.onclick = () => { set("effect", +b.dataset.effect); renderPanel(); });
    p.querySelector("#led-level").oninput = e => { set("level", +e.target.value); e.target.previousElementSibling.querySelector("b").textContent = `${+e.target.value + 1} / 5`; };
    p.querySelector("#led-color").oninput = e => { const v = e.target.value; st.cfg.r = parseInt(v.slice(1, 3), 16); st.cfg.g = parseInt(v.slice(3, 5), 16); st.cfg.b = parseInt(v.slice(5, 7), 16); push("cfg"); };
  },
  test(p) {
    p.querySelector("#tested-reset").onclick = () => { st.tested.clear(); render(); };
    p.querySelector("#tester-reset").onclick = () => { st.tester = { presses: 0, doubles: 0, up: new Map(), down: new Map(), log: [] }; render(); };
  },
  firmware(p) {
    if (st.flash.list === null && !st.flash.loading) { st.flash.loading = true; loadVersions(); }
    p.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => loadFirmware(st.flash.list.find(v => v.version === b.dataset.pick)));
    p.querySelector("#fl-file").onchange = e => { const f = e.target.files[0]; if (f) loadFirmware(f); };
    p.querySelector("#fl-agree").onchange = e => { st.flash.agree = e.target.checked; renderPanel(); };
    p.querySelector("#fl-go").onclick = flashFirmware;
    p.querySelector("#fl-pick")?.addEventListener("click", pickBootloader);
    p.querySelector("#fl-restore")?.addEventListener("click", restoreBackup);
    const boot = p.querySelector("#boot"); if (boot) boot.onclick = () => { st.confirmBoot = true; renderPanel(); };
    const yes = p.querySelector("#boot-yes"); if (yes) yes.onclick = async () => { st.confirmBoot = false; await st.kb.bootloader(); attach(demo()); };
    const no = p.querySelector("#boot-no"); if (no) no.onclick = () => { st.confirmBoot = false; renderPanel(); };
  },
  settings(p) {
    p.querySelector("#save2").onclick = save;
    p.querySelector("#defaults").onclick = async () => { await st.kb.defaults(); st.map = await st.kb.keymap(); st.cfg = await st.kb.config(); render(); };
    p.querySelector("#export").onclick = () => {
      const named = l => Object.fromEntries(KEYS.map(k => [k.code, kcShort(st.map[l][k.site])]));
      st.exportText = JSON.stringify({ format: "fun60-studio/1", base: [...st.map[0]], fn: [...st.map[1]], config: st.cfg, readable: { base: named(0), fn: named(1) } }, null, 1);
      renderPanel();
    };
    p.querySelector("#download").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([st.exportText], { type: "application/json" }));
      a.download = "fun60-backup.json"; a.click();
    };
    p.querySelector("#copy").onclick = () => navigator.clipboard.writeText(st.exportText).catch(() => $("backup").select());
    p.querySelector("#import-file").onchange = async e => { const f = e.target.files[0]; if (f) { st.exportText = await f.text(); renderPanel(); } };
    p.querySelector("#import").onclick = () => {
      try {
        const d = JSON.parse($("backup").value);
        if (d.format !== "fun60-studio/1" || d.base.length !== SITES) throw new Error("That isn't a FUN60 Studio backup.");
        st.map = [Uint8Array.from(d.base), Uint8Array.from(d.fn)]; st.cfg = { ...CONFIG_DEFAULT, ...d.config };
        st.exportText = $("backup").value; st.error = "";
        push("map").then(() => push("cfg")); render();
      } catch (e) { st.error = e.message; render(); }
    };
    p.querySelectorAll("[data-theme-pick]").forEach(b => b.onclick = () => { setTheme(b.dataset.themePick); renderPanel(); });
  },
};

async function save() {
  try {
    await st.kb.setKeymap(st.map); await st.kb.setConfig(st.cfg); await st.kb.save();
    st.savedMap = [st.map[0].slice(), st.map[1].slice()]; st.savedCfg = { ...st.cfg }; st.error = "";
  } catch (e) { st.error = e.message; }
  render();
}
async function revert() {
  st.map = [st.savedMap[0].slice(), st.savedMap[1].slice()]; st.cfg = { ...st.savedCfg };
  await push("map"); await push("cfg"); render();
}

/* ---------- key tester (browser key events, so it measures what the computer receives) ---------- */
addEventListener("keydown", e => {
  if (st.page !== "test" || e.repeat || e.target.closest("input, textarea")) return;
  if (!e.ctrlKey && !e.metaKey && !e.altKey) e.preventDefault();   /* keep browser shortcuts */
  const t = st.tester, now = performance.now(), last = t.up.get(e.code);
  const gap = last === undefined ? null : now - last, dbl = gap !== null && gap < 30;
  t.presses++; if (dbl) t.doubles++;
  t.down.set(e.code, now);
  t.log.unshift({ at: (now / 1000).toFixed(2) + "s", dbl, text: `${e.code.replace(/^(Key|Digit)/, "")} down${gap !== null ? `, ${gap.toFixed(1)} ms after release` : ""}${dbl ? "  DOUBLE" : ""}` });
  t.log.length = Math.min(t.log.length, 40);
  renderPanel();
});
addEventListener("keyup", e => { if (st.page === "test") st.tester.up.set(e.code, performance.now()); });

/* ---------- live loop: pressed keys, travel, LED preview ---------- */
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
function hue(h) {
  const s = Math.floor(h / 43) % 6, f = (h - Math.floor(h / 43) * 43) * 6;
  return [[255, f, 0], [255 - f, 255, 0], [0, 255, f], [0, 255 - f, 255], [f, 0, 255], [255, 0, 255 - f]][s];
}
function ledFrame(t) {
  const c = st.cfg, out = new Map(); let sum = 0;
  let scale = c.on ? LEVELS[c.level] : 0;
  if (c.effect === 1) { const p = t % 4000, tri = p < 2000 ? p : 4000 - p; scale = scale * (32 + tri * 223 / 2000) / 255; }
  for (const k of KEYS) {
    const rgb = c.effect === 2 ? hue(Math.floor(k.x / 15 * 256 + t / 16) & 255) : [c.r, c.g, c.b];
    const v = rgb.map(x => Math.round(x * scale / 255)); sum += v[0] + v[1] + v[2]; out.set(k.site, v);
  }
  const ma = sum * 20 / 255 * (61 / KEYS.length);
  return { out, ma: Math.min(ma, LED_BUDGET_MA), capped: ma > LED_BUDGET_MA ? LED_BUDGET_MA / ma : 1 };
}

const TRACE_MS = 4000;
function drawTrace(now) {
  const cv = $("tv-trace"); if (!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext("2d"), css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const y = pct => 6 + (h - 12) * pct / 100;
  if (!(st.info && st.info.proto < 5)) for (const [pct, c] of [[st.cfg.pressPct, "--warn"], [st.cfg.releasePct, "--live"]]) {
    g.strokeStyle = col(c); g.setLineDash([4, 4]); g.beginPath(); g.moveTo(0, y(pct)); g.lineTo(w, y(pct)); g.stroke();
  }
  g.setLineDash([]); g.strokeStyle = col("--accent"); g.lineWidth = 2; g.beginPath();
  st.trace.forEach(([t, pct], i) => { const x = w - (now - t) * w / TRACE_MS; i ? g.lineTo(x, y(pct)) : g.moveTo(x, y(pct)); });
  g.stroke();
}

let polling = false, lastPressed = new Set();
async function tick(t) {
  if (st.kb && !polling && !st.pollFailed) {
    polling = true;
    try {
      if (st.page === "travel") { st.raw = await st.kb.raw(); learn(st.raw); }
      const s = await st.kb.state(); st.pressed = s.pressed;
      if (st.info && st.info.proto >= 2 && !(t - st.powerAt < 2000)) {         /* v0.06+: GET_POWER */
        st.powerAt = t; st.power = await st.kb.power();
        const b = $("battery"); if (b) b.textContent = batteryText();
        const bp = $("battery-pct"), bb = $("battery-bar"), pc = st.power.percent;
        if (bp) { bp.textContent = pc ? pc + "%" : "-"; bb.style.width = pc + "%"; bb.style.background = pc && pc < 20 ? "var(--bad)" : "var(--live)"; }
        if (st.info.proto >= 3) {
          const was = st.radio && st.radio.mode;
          st.radio = await st.kb.radio(); const r = $("radio"); if (r) r.textContent = radioText();
          if (st.page === "device" && st.radio.mode !== was) renderPanel();   /* changed with the Fn keys */
        }
      }
    } catch (e) { st.error = e.message; st.pollFailed = true; renderTop(); }   /* until reconnect */
    polling = false;
  }
  /* new presses: the press test, and press-to-select on the Keys page */
  let fresh = false;
  for (const s of st.pressed) if (!lastPressed.has(s) && KEY_BY_SITE.has(s)) {
    if (!st.tested.has(s)) { st.tested.add(s); fresh = st.page === "test"; }
    if (st.page === "keys" && st.pressSelect) { st.sel.has(s) ? st.sel.delete(s) : st.sel.add(s); fresh = true; }
  }
  lastPressed = new Set(st.pressed);
  if (fresh) render();

  const led = st.page === "lighting" ? ledFrame(reduced.matches ? 0 : t) : null;
  const perf = st.page === "travel" && st.raw;
  document.querySelectorAll(".key").forEach(el => {
    const s = +el.dataset.site;
    el.classList.toggle("live", st.pressed.has(s));
    const cap = el.firstElementChild;
    if (led) {
      const [r, g, b] = led.out.get(s).map(x => Math.round(Math.min(255, x * led.capped * 2.2)));
      cap.style.setProperty("--led", `rgb(${r},${g},${b})`); cap.style.setProperty("--glow", st.cfg.on ? 0.55 : 0);
    } else cap.style.setProperty("--glow", 0);
    if (perf) {
      const tv = travel(s);
      el.querySelector(".bar").style.setProperty("--d", (tv.pct / 100).toFixed(3));
      el.querySelector(".lg2").textContent = tv.ok ? Math.round(tv.pct) + "%" : "-";
      el.classList.toggle("over", tv.ok && tv.pct >= st.cfg.pressPct);
    } else el.classList.remove("over");
  });
  if (perf && $("tv-fill")) {
    const tv = travel(st.focus);
    st.trace.push([t, tv.pct]); while (st.trace.length && t - st.trace[0][0] > TRACE_MS) st.trace.shift();
    $("tv-fill").style.height = tv.pct + "%";
    $("tv-nums").textContent = tv.ok ? `raw ${tv.v}  rest ${tv.rest}  bottom ${tv.bottom}  ${tv.pct.toFixed(0)} %` : `raw ${tv.v}, no switch read here yet`;
    drawTrace(t);
  }
  if (led && $("ma")) { $("ma").textContent = `${Math.round(led.ma)} mA`; $("ma-bar").style.width = (100 * led.ma / LED_BUDGET_MA) + "%"; }
  requestAnimationFrame(tick);
}

/* ---------- start ---------- */
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => { st.page = b.dataset.page; st.sel.clear(); render(); }));
$("save").onclick = save;
$("revert").onclick = revert;
buildBoard();
attach(demo()).then(async () => {
  if (!("hid" in navigator)) return;
  navigator.hid.addEventListener("disconnect", e => { if (st.kb && st.kb.dev === e.device && !st.flashing) { st.error = "The keyboard was unplugged."; attach(demo()); } });
  try {
    const known = (await navigator.hid.getDevices()).find(d => d.vendorId === 0x3151 && d.collections.some(c => c.usagePage === 0xFFFF));
    if (known) { if (!known.opened) await known.open(); await attach(new HidKeyboard(known)); }
  } catch (e) { /* the page shows the demo until Connect */ }
});
requestAnimationFrame(tick);
</script>
